name: Build & Publish Release APK

on:
  push:
    tags:
      - '*'

jobs:
  Gradle:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: setup jdk
      uses: actions/setup-java@v1
      with:
        java-version: 11
    - name: Make Gradle executable
      run: chmod +x ./gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease
    - name: Releasing using Hub
      uses: sangatdesai/release-apk@main
      env:
       GITHUB_TOKEN: ${{ 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 }}
       APP_FOLDER: CertifiedPropsOverlay
