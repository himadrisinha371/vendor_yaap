name: Compile Overlay APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Overlay
        run: |
          # 1. Compile resources
          aapt2 compile -o compiled.zip --dir res/
          
          # 2. Link to create APK
          aapt2 link -o overlay.apk \
              -I ${ANDROID_SDK_ROOT}/platforms/android-34/android.jar \
              --manifest AndroidManifest.xml \
              compiled.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OverlayAPK
          path: overlay.apk
          
