name: Compile Overlay APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # Manually install build-tools using sdkmanager
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"


      - name: Compile and Link Overlay
        run: |
          # Dynamically find the aapt2 path
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | tail -n 1)
          AAPT2="${BUILD_TOOLS_PATH}/aapt2"
          
          echo "Using AAPT2 at: $AAPT2"
          
          # 1. Compile resources
          $AAPT2 compile -o compiled_resources.zip --dir res/
          
          # 2. Link resources
          # Ensure you point to the correct android.jar for your target API
          $AAPT2 link -o overlay.apk \
              -I ${ANDROID_SDK_ROOT}/platforms/android-34/android.jar \
              --manifest AndroidManifest.xml \
              compiled_resources.zip
          
          # Verify output
          ls -lh overlay.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayAPK
          path: overlay.apk
